theme = "catppuccin_mocha"

[editor]
cursorline = true
true-color = true
color-modes = true
clipboard-provider = "termcode"

[editor.soft-wrap]
enable = true

[editor.file-picker]
hidden = false

[editor.gutters]
layout = ["diff", "diagnostics"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.insert]
"C-space" = "completion"

[keys.normal]
"C-/" = "@%s"
"C-." = "@<A-.>"
tab = "expand_selection"
"S-tab" = "shrink_selection"
H = "select_prev_sibling"
L = "select_next_sibling"
"C-y" = "@\"+y"
"S-c" = "@t<ret>c"
"A-c" = "copy_selection_on_next_line"
"S-d" = "@t<ret>d"
"S-y" = "@t<ret>y"

[keys.normal.space]
space = "command_palette"
tab = "goto_last_accessed_file"
d = ":buffer-close"
w = { d = "wclose" }
"=" = ":format"
q = ":wqa"
B = ":echo %sh{git lineblame %{buffer_name} %{cursor_line}}"
l = ":echo %sh{git permalink %{buffer_name} %{selection_line_start} %{selection_line_end} | osc copy}copied permalink to clipboard"
y = ":echo %sh{echo %{buffer_name} | osc copy}copied path to clipboard"
Y = ":echo %sh{realpath %{buffer_name} | osc copy}copied abspath to clipboard"

[keys.select]
"C-y" = "@\"+y"
# o = "flip_selections" # maybe just get used to the alt-; binding since it works in normal mode too
